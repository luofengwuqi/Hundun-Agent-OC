<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      渲染层只加载本地打包产物。CSP 里保留 'unsafe-inline' 的 style 是因为
      Vue 的 :style / 组件内联样式会产生 style 属性，与脚本执行无关。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <title>馄饨Agent-OC</title>
  </head>
  <body>
    <div id="app"></div>
    <!--BUNDLE-->
  </body>
</html>
